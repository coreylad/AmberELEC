name: build-r36s

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted Linux x64 runner with at least 16 GB RAM and 200 GB free disk
        required: true
        default: ubuntu-22.04-16core
        type: string

permissions:
  contents: read

concurrency:
  group: build-r36s-${{ github.ref }}
  cancel-in-progress: false

env:
  LOCAL_CC: /usr/bin/gcc-10
  LOCAL_CXX: /usr/bin/g++-10
  CONCURRENCY_MAKE_LEVEL: "4"
  THREADCOUNT: "4"

jobs:
  build-r36s:
    timeout-minutes: 360
    runs-on: ${{ inputs.runner || 'ubuntu-22.04-16core' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check cloud runner resources
        run: |
          available_kb=$(df --output=avail "$GITHUB_WORKSPACE" | tail -n 1)
          memory_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          if (( available_kb < 200 * 1024 * 1024 || memory_kb < 15 * 1024 * 1024 )); then
            echo "::error::Use a larger GitHub-hosted Linux x64 runner with at least 16 GB RAM and 200 GB free disk."
            exit 1
          fi
      - name: Install native build dependencies
        run: |
          . /etc/os-release
          if [[ "$ID" != ubuntu || "$VERSION_ID" != 22.04 || "$(uname -m)" != x86_64 ]]; then
            echo "::error::Use an Ubuntu 22.04 x64 runner for the native build."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y \
            gcc-10 g++-10 make git unzip wget bison flex linux-libc-dev linux-libc-dev-arm64-cross \
            xz-utils libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev \
            rapidjson-dev libasound2-dev libgl1-mesa-dev build-essential libboost-all-dev cmake fonts-droid-fallback \
            libvlc-dev libvlccore-dev vlc-bin texinfo premake4 golang libssl-dev curl patchelf \
            xmlstarlet patchutils gawk gperf xfonts-utils default-jre python-is-python3 xsltproc libjson-perl \
            libxml-parser-perl lzop libncurses5-dev device-tree-compiler u-boot-tools rsync p7zip unrar \
            libparse-yapp-perl zip binutils-aarch64-linux-gnu dos2unix p7zip-full libvpx-dev bsdmainutils bc meson rdfind
      - name: Build RK3326 toolchain
        run: |
          set -e
          make toolchain-RK3326
      - name: Build R36S image
        run: |
          set -e
          make R36S
      - name: Prepare uncompressed R36S image
        run: |
          shopt -s nullglob
          images=(release/aarch64/R36S/*.img.gz)
          if (( ${#images[@]} == 0 )); then
            echo "::error::The build did not produce an R36S image."
            exit 1
          fi
          for image in "${images[@]}"; do
            gzip --decompress "$image"
          done
      - name: Publish R36S image artifact
        uses: actions/upload-artifact@v7
        with:
          name: AmberELEC-R36S-${{ github.sha }}
          path: release/aarch64/R36S/*.img
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
